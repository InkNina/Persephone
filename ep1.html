<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ep1 — сон</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:Georgia,serif}
canvas{display:block;width:100vw;height:100vh}
#ok{position:fixed;left:0;top:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#9e2b2b;font-size:24px;background:#000;z-index:10;text-align:center;padding:20px}
#wake{position:fixed;left:0;bottom:8%;width:100%;text-align:center;color:rgba(210,200,180,0.5);font-size:15px;letter-spacing:1px;z-index:9;transition:opacity 1s}
#wake.gone{opacity:0;pointer-events:none}
</style>
</head>
<body>
<div id="ok">Если видишь эту надпись — код не запустился. Пересохрани файл целиком.</div>
<div id="wake">коснись, чтобы услышать сон</div>
<canvas id="c"></canvas>
<script>
var cv=document.getElementById('c'),ctx=cv.getContext('2d');
var okEl=document.getElementById('ok');if(okEl)okEl.style.display='none';
var wakeEl=document.getElementById('wake');
var W,H,U,DPR=Math.min(window.devicePixelRatio||1,2);
function resize(){W=cv.width=Math.floor(innerWidth*DPR);H=cv.height=Math.floor(innerHeight*DPR);cv.style.width=innerWidth+'px';cv.style.height=innerHeight+'px';U=(H>W)?W*1.5:H;}
window.addEventListener('resize',resize);resize();

var PI2=Math.PI*2;
var t=0,last=performance.now();
var SHOTS=[{a:0.8,b:5.8},{a:6.5,b:10.5},{a:11.2,b:14.7},{a:15.4,b:21.0}];
var FADE=0.7,END=22.5;
var WARM='#d8b87a',COLD='#c9c2a8',POME='#9e2b2b';

function newPetal(rand){return{nx:Math.random(),ny:rand?Math.random():-0.03,vx:(Math.random()-0.5)*0.0009,vy:0.0009+Math.random()*0.0016,rn:0.0014+Math.random()*0.0026,a:Math.random()*PI2,va:(Math.random()-0.5)*0.05};}
var petals=[];for(var j=0;j<70;j++)petals.push(newPetal(true));
var crumbs=[];for(var i=0;i<40;i++)crumbs.push({nx:Math.random(),ny:0.7+Math.random()*0.3,vx:0,vy:0,rn:0.004+Math.random()*0.006,live:0});
var clods=[];for(var c=0;c<7;c++)clods.push({nx:0.2+Math.random()*0.6,ny:0.82+Math.random()*0.12,rn:0.02+Math.random()*0.03,a:1});

var AC=window.AudioContext||window.webkitAudioContext,actx=null,earthG=null,windG=null,started=false,windOn=false,breathPlayed=false,scrapedIdx=-1;
function noiseBuf(sec){var n=Math.floor(actx.sampleRate*sec),b=actx.createBuffer(1,n,actx.sampleRate),d=b.getChannelData(0);for(var i=0;i<n;i++)d[i]=Math.random()*2-1;return b;}
function startEarth(){var s=actx.createBufferSource();s.buffer=noiseBuf(2);s.loop=true;var f=actx.createBiquadFilter();f.type='lowpass';f.frequency.value=150;earthG=actx.createGain();earthG.gain.value=0.05;s.connect(f);f.connect(earthG);earthG.connect(actx.destination);s.start();}
function startWind(){if(windOn||!actx)return null;windOn=true;var s=actx.createBufferSource();s.buffer=noiseBuf(2);s.loop=true;var f=actx.createBiquadFilter();f.type='lowpass';f.frequency.value=300;var g=actx.createGain();g.gain.value=0.0;s.connect(f);f.connect(g);g.connect(actx.destination);s.start();return g;}
function scrape(){if(!actx)return;var s=actx.createBufferSource();s.buffer=noiseBuf(0.10);var f=actx.createBiquadFilter();f.type='bandpass';f.frequency.value=900+Math.random()*500;var g=actx.createGain();g.gain.setValueAtTime(0.0001,actx.currentTime);g.gain.linearRampToValueAtTime(0.22,actx.currentTime+0.006);g.gain.linearRampToValueAtTime(0.0001,actx.currentTime+0.10);s.connect(f);f.connect(g);g.connect(actx.destination);s.start();}
function breath(){if(!actx)return;var s=actx.createBufferSource();s.buffer=noiseBuf(0.6);var f=actx.createBiquadFilter();f.type='bandpass';f.frequency.value=480;var g=actx.createGain();g.gain.setValueAtTime(0.0001,actx.currentTime);g.gain.linearRampToValueAtTime(0.20,actx.currentTime+0.14);g.gain.linearRampToValueAtTime(0.0001,actx.currentTime+0.6);s.connect(f);f.connect(g);g.connect(actx.destination);s.start();}
function wake(){if(started)return;started=true;try{actx=new AC();if(actx.state==='suspended')actx.resume();startEarth();windG=startWind();}catch(e){}wakeEl.classList.add('gone');}
window.addEventListener('click',wake);
window.addEventListener('touchstart',function(){wake();},{passive:true});

function ln(x1,y1,x2,y2,w,col){ctx.strokeStyle=col;ctx.lineWidth=w;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();}
function ci(x,y,r,col){ctx.fillStyle=col;ctx.beginPath();ctx.arc(x,y,r,0,PI2);ctx.fill();}

function hand(cx,cy,ang,sc,col,pose,mir){
 ctx.save();ctx.translate(cx,cy);ctx.rotate(ang);if(mir)ctx.scale(-1,1);
 ctx.fillStyle=col;ctx.strokeStyle=col;ctx.lineCap='round';ctx.lineJoin='round';
 ctx.beginPath();ctx.ellipse(0,0,sc*0.26,sc*0.40,0,0,PI2);ctx.fill();
 var f=[],i;
 if(pose==='grab'){
  for(i=0;i<4;i++)f.push([-sc*0.18+i*sc*0.12,sc*0.34,Math.PI/2+(i-1.5)*0.12,sc*0.30,0.9,sc*0.16]);
  // БОЛЬШОЙ: правый край, ВНИЗ (как остальные), кончик подогнут ВЛЕВО к остальным — сомкнутый хват (вид тыла ладони)
  f.push([sc*0.26,-sc*0.04,Math.PI/2,sc*0.26,0.7,sc*0.13]);
 }else if(pose==='open'){
  for(i=0;i<4;i++)f.push([-sc*0.18+i*sc*0.12,-sc*0.34,-Math.PI/2+(i-1.5)*0.22,sc*0.34,0,0]);
  f.push([-sc*0.26,sc*0.02,Math.PI+0.5,sc*0.24,0,0]);
 }else if(pose==='cover'){
  for(i=0;i<4;i++)f.push([sc*0.22,-sc*0.12+i*sc*0.09,0,sc*0.34,0,0]);
  f.push([sc*0.10,sc*0.20,0.5,sc*0.20,0,0]);
 }else if(pose==='fist'){
  for(i=0;i<4;i++){ctx.beginPath();ctx.arc(-sc*0.16+i*sc*0.11,sc*0.10,sc*0.10,Math.PI,0);ctx.fill();}
  ctx.beginPath();ctx.arc(sc*0.20,0,sc*0.09,Math.PI*1.2,Math.PI*2.2);ctx.fill();
 }
 ctx.lineWidth=sc*0.10;
 for(var k=0;k<f.length;k++){var p=f[k];var x0=p[0],y0=p[1];var x1=x0+Math.cos(p[2])*p[3];var y1=y0+Math.sin(p[2])*p[3];ctx.beginPath();ctx.moveTo(x0,y0);ctx.lineTo(x1,y1);if(p[5]>0){var x2=x1+Math.cos(p[2]+p[4])*p[5];var y2=y1+Math.sin(p[2]+p[4])*p[5];ctx.lineTo(x2,y2);}ctx.stroke();}
 ctx.restore();
}
function moon(x,y,r){ctx.strokeStyle='#cfd6da';ctx.lineWidth=1.6*DPR;ctx.beginPath();ctx.arc(x,y,r,0.5,5.8);ctx.stroke();}

function earthDark(){var g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#120c07');g.addColorStop(0.6,'#1c130b');g.addColorStop(1,'#0a0603');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);}
function resetClods(){for(var i=0;i<clods.length;i++)clods[i].a=1;}
function soilBand(){ctx.fillStyle='#241812';ctx.fillRect(0,H*0.78,W,H*0.22);for(var i=0;i<clods.length;i++){var o=clods[i];if(o.a<=0)continue;ci(o.nx*W,o.ny*H,o.rn*U*o.a,'#3a281a');}}
function crumbSpawn(x,y,n){for(var i=0;i<n;i++){var p=crumbs[Math.floor(Math.random()*crumbs.length)];p.nx=x/W+(Math.random()-0.5)*0.04;p.ny=y/H;p.vx=(Math.random()-0.5)*0.002;p.vy=0.002+Math.random()*0.003;p.live=1;}}
function crumbDraw(){for(var i=0;i<crumbs.length;i++){var p=crumbs[i];if(p.live<=0)continue;p.nx+=p.vx;p.ny+=p.vy;p.live-=0.02;if(p.ny>1.05)p.live=0;ci(p.nx*W,p.ny*H,p.rn*U*0.5,'rgba(50,35,22,'+(p.live*0.8)+')');}}

function morningSky(){var g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#9fb0bc');g.addColorStop(0.5,'#c4c8c2');g.addColorStop(1,'#dcd6c8');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);}
function tree(x,sc,sd,by){var y=by||H*0.74,tr=U*0.15*sc;ctx.strokeStyle='#5b4a39';ctx.lineWidth=3*sc*DPR;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x,y-tr);ctx.stroke();for(var i=0;i<7;i++){var a=sd+i,rr=tr*(0.5+0.3*Math.sin(a*3));ci(x+Math.cos(a)*rr*0.9,y-tr+Math.sin(a*1.3)*rr*0.5,tr*0.42,'rgba(245,238,228,0.95)');}for(var j=0;j<9;j++){var b=sd*2+j;ci(x+Math.cos(b)*tr*0.7,y-tr+Math.sin(b)*tr*0.4,tr*0.12,'rgba(240,208,214,0.6)');}}
function petalDraw(){for(var k=0;k<petals.length;k++){var p=petals[k];p.nx+=p.vx;p.ny+=p.vy;p.a+=p.va;if(p.ny>1.05){petals[k]=newPetal(false);continue;}ctx.save();ctx.translate(p.nx*W,p.ny*H);ctx.rotate(p.a);ctx.fillStyle='rgba(247,240,232,0.9)';ctx.beginPath();ctx.ellipse(0,0,p.rn*H*1.6,p.rn*H,0,0,PI2);ctx.fill();ctx.restore();}}
function topGlow(k){if(k<=0)return;var g=ctx.createLinearGradient(0,0,0,H*0.5);g.addColorStop(0,'rgba(180,190,200,'+(0.4*k)+')');g.addColorStop(1,'rgba(180,190,200,0)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H*0.5);}

function drawShot1(tl){
 earthDark();soilBand();
 var cyc=1.25,idx=Math.floor(tl/cyc),ph=(tl%cyc)/cyc,active=idx%2;
 var swing=Math.sin(ph*Math.PI),sc=U*0.30,topY=H*0.30,reach=swing*U*0.05;
 if(active===0){
  var lx=W*0.38,ly=topY+reach;
  // левая: большой справа (внутрь пары), пальцы к центру
  hand(lx,ly,-(0.12+swing*0.18),sc,WARM,'grab',false);
  moon(lx,ly-sc*0.45,sc*0.07);
  if(ph>0.55&&ph<0.7)crumbSpawn(lx,H*0.80,3);
 }else{
  var rx=W*0.62,ry=topY+reach;
  // правая = зеркало левой: большой слева (внутрь пары), пальцы к центру
  hand(rx,ry,+(0.12+swing*0.18),sc,WARM,'grab',true);
  moon(rx,ry-sc*0.45,sc*0.07);
  if(ph>0.55&&ph<0.7)crumbSpawn(rx,H*0.80,3);
 }
 if(ph>0.55&&scrapedIdx!==idx){scrape();scrapedIdx=idx;for(var i=0;i<clods.length;i++){var o=clods[i];if(o.ny>0.84)o.a=Math.max(0,o.a-0.18);}}
 crumbDraw();
}

function drawShot2(tl){
 earthDark();resetClods();soilBand();
 var PORT=H>W;
 var drift=Math.sin(tl*1.2)*(PORT?W*0.006:U*0.008);
 var sc=U*0.30;
 var fx=PORT?W*0.26:W*0.40, fy=PORT?H*0.62:H*0.66;
 if(!PORT){
  ctx.strokeStyle=COLD;ctx.lineWidth=sc*0.22;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(fx,fy+sc*0.3);ctx.lineTo(fx-sc*0.1,H*0.80);ctx.stroke();
 }
 hand(fx,fy,0.05,sc,COLD,'fist',false);
 ci(fx+sc*0.20,fy+sc*0.07,sc*0.17,POME);
 var ox=PORT?W*0.60:W*0.52, oy=PORT?H*0.56:H*0.58;
 if(!PORT){
  ctx.strokeStyle=COLD;ctx.lineWidth=sc*0.22;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(ox,oy+sc*0.3);ctx.lineTo(ox+sc*0.1,H*0.80);ctx.stroke();
 }
 hand(ox,oy,-0.12,sc,COLD,'open',false);
 var low=Math.min(1,tl/1.6);
 var wx=ox, wyS=PORT?H*0.18:H*0.20, wyE=oy-sc*0.5;
 var wy=wyS+low*(wyE-wyS);
 if(!PORT){
  ctx.strokeStyle=WARM;ctx.lineWidth=sc*0.24;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(wx,wy-sc*0.4);ctx.lineTo(wx+sc*0.12,H*0.05);ctx.stroke();
 }
 // тёплая накрывает: большой справа, вниз, подогнут к остальным (как красный эталон)
 hand(wx,wy,0.10,sc,WARM,'grab',false);
 moon(wx+sc*0.06,wy-sc*0.5,sc*0.07);
}

function drawShot3(tl){
 earthDark();resetClods();soilBand();
 var PORT=H>W;
 topGlow(0.22+tl*0.05);
 var rise=tl*(PORT?W*0.012:U*0.02);
 var sc=PORT?U*0.30:U*0.24;
 var gh=U*0.05;

 ctx.save();
 ctx.translate(PORT?W*0.42:W*0.48,H*0.78-rise*0.25);
 ctx.rotate(-0.12);
 ctx.fillStyle='#3a3a40';
 ctx.beginPath();
 ctx.moveTo(-sc*0.33,sc*0.16);
 ctx.lineTo(sc*0.33,sc*0.16);
 ctx.lineTo(sc*0.23,-sc*0.66);
 ctx.lineTo(-sc*0.23,-sc*0.66);
 ctx.closePath();
 ctx.fill();
 ctx.restore();

 ctx.save();
 ctx.translate(PORT?W*0.40:W*0.45,H*0.585-rise*0.3);
 ctx.rotate(0.32);
 ctx.fillStyle='#c9bba0';
 ctx.beginPath();ctx.ellipse(0,0,gh,gh*1.2,0,0,PI2);ctx.fill();
 ctx.fillStyle='#241d1a';
 ctx.beginPath();ctx.arc(0,-gh*0.2,gh*1.1,Math.PI*1.05,Math.PI*1.95);ctx.fill();
 ctx.fillStyle='#2c2c31';
 ctx.fillRect(-gh,-gh*0.4,gh*2,gh*0.35);
 ctx.strokeStyle='#241d1a';ctx.lineWidth=1.4*DPR;
 ctx.beginPath();ctx.moveTo(-gh*0.5,gh*0.15);ctx.lineTo(-gh*0.18,gh*0.18);ctx.stroke();
 ctx.beginPath();ctx.moveTo(gh*0.18,gh*0.18);ctx.lineTo(gh*0.5,gh*0.15);ctx.stroke();
 ctx.restore();

 var hx=PORT?W*0.52:W*0.55, hy=H*0.50-rise;
 ctx.strokeStyle=COLD;ctx.lineWidth=sc*0.26;ctx.lineCap='round';
 ctx.beginPath();ctx.moveTo(PORT?W*0.46:W*0.50,PORT?H*0.62:H*0.66-rise*0.35);ctx.lineTo(hx,hy+sc*0.25);ctx.stroke();
 hand(hx,hy,-0.10,sc,COLD,'open',false);

 ctx.fillStyle='#6f6a4f';
 ctx.beginPath();
 ctx.moveTo(PORT?W*0.62:W*0.66,H*0.10);
 ctx.lineTo(PORT?W*0.80:W*0.86,H*0.17);
 ctx.lineTo(PORT?W*0.72:W*0.78,H*0.32);
 ctx.lineTo(PORT?W*0.58:W*0.60,H*0.25);
 ctx.closePath();
 ctx.fill();

 ctx.save();
 ctx.translate(PORT?W*0.66:W*0.70,H*0.12);
 ctx.rotate(-0.45);
 ctx.fillStyle='#d8b89a';
 ctx.beginPath();ctx.ellipse(0,0,gh,gh*1.16,0,0,PI2);ctx.fill();
 ctx.fillStyle='#d9c98f';
 ctx.beginPath();ctx.arc(0,-gh*0.1,gh*1.1,Math.PI*0.95,Math.PI*2.05);ctx.fill();
 ctx.beginPath();ctx.arc(gh*0.9,gh*0.2,gh*0.44,0,PI2);ctx.fill();
 ctx.fillStyle='#241d1a';
 ci(-gh*0.44,gh*0.24,gh*0.12,'#241d1a');
 ctx.restore();

 var ex=hx, ey=hy-sc*0.45;
 ctx.strokeStyle=WARM;ctx.lineWidth=sc*0.28;ctx.lineCap='round';
 ctx.beginPath();ctx.moveTo(PORT?W*0.68:W*0.70,PORT?H*0.26:H*0.22);ctx.lineTo(ex,ey);ctx.stroke();
 hand(ex,ey,0.12,sc,WARM,'grab',true);
 moon(PORT?W*0.66:W*0.68,PORT?H*0.24:H*0.20,gh*0.4);

 if(Math.random()<0.05)crumbSpawn(PORT?W*0.46:W*0.50,H*0.78,1);
 crumbDraw();
}

function drawShot4(tl){
 morningSky();
 ctx.fillStyle='#3a2c20';ctx.fillRect(0,H*0.80,W,H*0.20);
 tree(W*0.12,1.0,1.2,H*0.80);
 tree(W*0.30,1.05,2.9,H*0.80);
 tree(W*0.70,0.95,4.4,H*0.80);
 tree(W*0.92,1.1,3.7,H*0.80);

 var PORT=H>W;
 var s=PORT?W*0.0032:U*0.0026;
 var fy=H*0.80, ax=PORT?W*0.42:W*0.47, px=PORT?W*0.58:W*0.53, tilt=PORT?-0.09:-0.16;

 ctx.save();
 ctx.translate(px,fy);
 ctx.rotate(tilt);
 ctx.fillStyle='#3a3a40';
 ctx.beginPath();
 ctx.moveTo(-25*s,-148*s+10*s);
 ctx.lineTo(25*s,-148*s+10*s);
 ctx.lineTo(19*s,0);
 ctx.lineTo(-19*s,0);
 ctx.closePath();
 ctx.fill();
 ctx.fillStyle='#241d1a';
 ctx.beginPath();ctx.arc(0,-166*s,17*s,0,PI2);ctx.fill();
 ci(0,-166*s,14*s,'#d8c3a8');
 ctx.fillStyle='#2c2c31';
 ctx.beginPath();ctx.arc(0,-172*s,16*s,Math.PI,0);ctx.fill();
 ctx.fillRect(-16*s,-174*s,32*s,6*s);
 ctx.fillStyle='#9aa07a';ctx.fillRect(4*s,-172*s,7*s,7*s);
 hand(14*s,-96*s,0.3,16*s,COLD,'fist',false);
 ci(20*s,-92*s,7*s,POME);
 ctx.restore();

 ctx.fillStyle='#6f6a4f';
 ctx.beginPath();
 ctx.moveTo(ax-26*s,fy-150*s+10*s);
 ctx.lineTo(ax+26*s,fy-150*s+10*s);
 ctx.lineTo(ax+20*s,fy);
 ctx.lineTo(ax-20*s,fy);
 ctx.closePath();
 ctx.fill();
 ci(ax,fy-168*s,16*s,'#d8b89a');
 ctx.fillStyle='#d9c98f';
 ctx.beginPath();ctx.arc(ax,fy-172*s,17*s,Math.PI,0);ctx.fill();
 moon(ax,fy-132*s,5*s);

 if(PORT){
  var tx=px-22*s, ty=fy-138*s;
  ctx.strokeStyle=WARM;ctx.lineWidth=15*s*0.9;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(ax+22*s,fy-128*s);ctx.lineTo(tx,ty);ctx.stroke();
  hand(tx,ty,-0.2,15*s,WARM,'cover',false);
 }else{
  hand(ax+18*s,fy-126*s,-0.35,15*s,WARM,'cover',false);
 }

 petalDraw();
}

function fadeAlpha(){for(var i=0;i<SHOTS.length;i++){var s=SHOTS[i];if(t>=s.a&&t<=s.b){var tin=Math.min(1,(t-s.a)/FADE),tout=Math.min(1,(s.b-t)/FADE);return 1-Math.min(tin,tout);}}return 1;}

function frame(now){
 var dt=Math.min(0.05,(now-last)/1000);last=now;t+=dt;
 if(t>4&&!started)wakeEl.classList.add('gone');
 var sh=0;for(var q=0;q<SHOTS.length;q++){if(t>=SHOTS[q].a&&t<=SHOTS[q].b)sh=q+1;}
 if(actx&&earthG){
  if(sh>0&&sh<4){earthG.gain.value=0.05;if(sh===1&&windG)windG.gain.value=0;}
  else if(sh===4){var tl4=t-SHOTS[3].a;earthG.gain.value=Math.max(0,0.05*(1-tl4/1.2));if(!breathPlayed&&tl4>0.2){breathPlayed=true;breath();}if(windG)windG.gain.value=Math.min(0.05,tl4*0.03);}
  else earthG.gain.value=0.05;
 }
 if(sh===1)drawShot1(t-SHOTS[0].a);
 else if(sh===2)drawShot2(t-SHOTS[1].a);
 else if(sh===3)drawShot3(t-SHOTS[2].a);
 else if(sh===4)drawShot4(t-SHOTS[3].a);
 else earthDark();
 var fa=fadeAlpha();
 if(fa>0){ctx.fillStyle='rgba(0,0,0,'+fa+')';ctx.fillRect(0,0,W,H);}
 if(t>END){ctx.fillStyle='rgba(0,0,0,1)';ctx.fillRect(0,0,W,H);}
 requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
